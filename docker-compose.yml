services:
  nginx:
    image: nginx:1.25-alpine
    restart: unless-stopped
    ports:
      # For local use. In production, terminate TLS at a managed ingress/reverse proxy.
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      app:
        condition: service_healthy
    networks:
      - mce_network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 8000
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in the private .env file using host postgres}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in the private .env file}
      SEPAY_WEBHOOK_SECRET: ${SEPAY_WEBHOOK_SECRET:-}
      VIETQR_BANK_CODE: ${VIETQR_BANK_CODE:-MB}
      VIETQR_ACCOUNT_NO: ${VIETQR_ACCOUNT_NO:-}
      VIETQR_ACCOUNT_NAME: ${VIETQR_ACCOUNT_NAME:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8000/api/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - mce_network

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in the private .env file}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in the private .env file}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the private .env file}
    # Bind to loopback only; never expose the database to the public Internet.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - mce_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - mce_network

  # Optional profile only. The current API has no Redis consumer.
  redis:
    image: redis:7-alpine
    profiles: ["cache"]
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD before enabling the cache profile}
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD before enabling the cache profile}"]
    volumes:
      - mce_redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - mce_network

volumes:
  mce_pgdata:
  mce_redisdata:

networks:
  mce_network:
    driver: bridge
