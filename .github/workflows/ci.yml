name: CI

on:
  push:
    branches:
      - main
      - feat/typescript-native-foundation
  pull_request:
    branches:
      - main

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: npm test
        env:
          DATABASE_URL: postgresql://build:build@localhost:5432/build
          JWT_SECRET: ci-only-secret-value-not-used-for-deployment-000000000000
  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npx tsc --noEmit
